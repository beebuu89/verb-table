<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Super Verb Table Game! 🌟</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
        }
        .font-fun {
            font-family: 'Fredoka', cursive;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-xl bg-white rounded-3xl p-6 sm:p-8 card-shadow border-4 border-sky-200 transition-all">
        
        <!-- Game Screen -->
        <div id="game-screen" class="space-y-6">
            <!-- Header & Score -->
            <div class="text-center space-y-2">
                <h1 class="text-3xl sm:text-4xl font-bold font-fun text-sky-600 tracking-wide">
                    ✏️ Verb Table Game!
                </h1>
                <div class="flex justify-between items-center bg-sky-50 px-4 py-2 rounded-2xl border border-sky-100">
                    <span id="question-count" class="font-bold text-sky-700 text-sm sm:text-base">Question 1 / 20</span>
                    <span id="score-text" class="font-bold text-amber-500 text-sm sm:text-base">Score: 0 / 20</span>
                </div>
            </div>

            <!-- Card Frame -->
            <div class="bg-gradient-to-b from-sky-50 to-white rounded-2xl p-5 border-2 border-sky-100 space-y-4">
                <p class="text-center text-gray-600 font-semibold text-sm sm:text-base">
                    Fill in the missing verb forms (Press <kbd class="px-2 py-0.5 bg-gray-100 border border-gray-300 rounded text-xs">Enter</kbd> to submit):
                </p>

                <!-- Inputs Grid -->
                <div class="space-y-4 max-w-md mx-auto">
                    <!-- Present (Given) -->
                    <div class="flex items-center space-x-3">
                        <label class="w-32 text-right font-bold text-gray-700 text-sm sm:text-base">Present:</label>
                        <input id="present-input" type="text" disabled 
                               class="w-full px-4 py-3 bg-gray-100 border-2 border-gray-200 rounded-xl font-bold text-lg text-sky-800 text-center cursor-not-allowed">
                    </div>

                    <!-- Past (Input) -->
                    <div class="flex items-center space-x-3">
                        <label for="past-input" class="w-32 text-right font-bold text-gray-700 text-sm sm:text-base">Past:</label>
                        <input id="past-input" type="text" autocomplete="off" placeholder="e.g. played"
                               class="w-full px-4 py-3 bg-white border-2 border-sky-300 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 rounded-xl font-bold text-lg text-gray-800 text-center outline-none transition-all">
                    </div>

                    <!-- Past Participle (Input) -->
                    <div class="flex items-center space-x-3">
                        <label for="pp-input" class="w-32 text-right font-bold text-gray-700 text-sm sm:text-base">Past Participle:</label>
                        <input id="pp-input" type="text" autocomplete="off" placeholder="e.g. played"
                               class="w-full px-4 py-3 bg-white border-2 border-sky-300 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 rounded-xl font-bold text-lg text-gray-800 text-center outline-none transition-all">
                    </div>
                </div>

                <!-- Feedback Display -->
                <div id="feedback-box" class="min-h-[48px] flex items-center justify-center text-center p-2 rounded-xl text-base font-bold transition-all"></div>
            </div>

            <!-- Submit Button -->
            <button id="submit-btn" onclick="checkAnswer()"
                    class="w-full py-4 bg-sky-500 hover:bg-sky-600 active:scale-[0.98] text-white font-fun text-xl font-bold rounded-2xl shadow-lg shadow-sky-200 transition-all flex items-center justify-center space-x-2">
                <span>Check Answer</span>
                <span>🚀</span>
            </button>
        </div>

        <!-- End Screen (Hidden by default) -->
        <div id="end-screen" class="hidden text-center space-y-6 py-4">
            <div class="text-6xl animate-bounce">🏆</div>
            <h2 class="text-3xl font-bold font-fun text-amber-500">Quiz Completed!</h2>
            
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-6 max-w-md mx-auto space-y-2">
                <p class="text-gray-600 font-semibold">Your Final Score:</p>
                <p id="final-score" class="text-4xl font-extrabold text-amber-600">0 / 20</p>
                <p id="final-praise" class="text-sm font-bold text-gray-700 pt-2"></p>
            </div>

            <button onclick="initGame()"
                    class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-fun text-xl font-bold rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center space-x-2">
                <span>Play Again (New 20 Verbs!)</span>
                <span>🔄</span>
            </button>
        </div>

    </div>

    <script>
        // Master Database of all 172 Verbs across Pages 1 - 6
        const FULL_VERB_DATABASE = [
            // Page 1
            ["answer", "answered", "answered"],
            ["ask", "asked", "asked"],
            ["call", "called", "called"],
            ["climb", "climbed", "climbed"],
            ["enjoy", "enjoyed", "enjoyed"],
            ["help", "helped", "helped"],
            ["jump", "jumped", "jumped"],
            ["knock", "knocked", "knocked"],
            ["laugh", "laughed", "laughed"],
            ["listen", "listened", "listened"],
            ["look", "looked", "looked"],
            ["open", "opened", "opened"],
            ["pass", "passed", "passed"],
            ["pick", "picked", "picked"],
            ["play", "played", "played"],
            ["rain", "rained", "rained"],
            ["rest", "rested", "rested"],
            ["shout", "shouted", "shouted"],
            ["show", "showed", "showed / shown"],
            ["start", "started", "started"],
            ["stay", "stayed", "stayed"],
            ["talk", "talked", "talked"],
            ["turn", "turned", "turned"],
            ["wait", "waited", "waited"],
            ["wash", "washed", "washed"],
            ["watch", "watched", "watched"],
            ["work", "worked", "worked"],
            ["agree", "agreed", "agreed"],
            ["believe", "believed", "believed"],
            ["change", "changed", "changed"],
            ["close", "closed", "closed"],
            ["dance", "danced", "danced"],

            // Page 2
            ["die", "died", "died"],
            ["live", "lived", "lived"],
            ["move", "moved", "moved"],
            ["promise", "promised", "promised"],
            ["smile", "smiled", "smiled"],
            ["use", "used", "used"],
            ["beg", "begged", "begged"],
            ["clap", "clapped", "clapped"],
            ["drop", "dropped", "dropped"],
            ["kidnap", "kidnapped", "kidnapped"],
            ["plan", "planned", "planned"],
            ["rob", "robbed", "robbed"],
            ["rub", "rubbed", "rubbed"],
            ["quarrel", "quarrelled", "quarrelled"],
            ["stir", "stirred", "stirred"],
            ["stop", "stopped", "stopped"],
            ["trap", "trapped", "trapped"],
            ["travel", "travelled", "travelled"],
            ["carry", "carried", "carried"],
            ["copy", "copied", "copied"],
            ["cry", "cried", "cried"],
            ["hurry", "hurried", "hurried"],
            ["pay", "paid", "paid"],
            ["reply", "replied", "replied"],
            ["say", "said", "said"],
            ["study", "studied", "studied"],
            ["tidy", "tidied", "tidied"],
            ["try", "tried", "tried"],
            ["dig", "dug", "dug"],
            ["find", "found", "found"],
            ["get", "got", "got"],
            ["hang", "hung", "hung"],
            ["hang (put to death)", "hanged, hung", "hanged, hung"],
            ["hear", "heard", "heard"],

            // Page 3
            ["hold", "held", "held"],
            ["light", "lit", "lit"],
            ["lose", "lost", "lost"],
            ["make", "made", "made"],
            ["sell", "sold", "sold"],
            ["shine", "shone", "shone"],
            ["shoot", "shot", "shot"],
            ["sit", "sat", "sat"],
            ["stand", "stood", "stood"],
            ["stick", "stuck", "stuck"],
            ["strike", "struck", "struck"],
            ["swing", "swung", "swung"],
            ["tell", "told", "told"],
            ["understand", "understood", "understood"],
            ["win", "won", "won"],
            ["bring", "brought", "brought"],
            ["buy", "bought", "bought"],
            ["fight", "fought", "fought"],
            ["think", "thought", "thought"],
            ["creep", "crept", "crept"],
            ["catch", "caught", "caught"],
            ["teach", "taught", "taught"],
            ["feed", "fed", "fed"],
            ["feel", "felt", "felt"],
            ["keep", "kept", "kept"],
            ["kneel", "knelt", "knelt"],
            ["lead", "led", "led"],
            ["leave", "left", "left"],
            ["meet", "met", "met"],
            ["sleep", "slept", "slept"],
            ["smell", "smelt", "smelt"],
            ["spell", "spelt", "spelt"],
            ["sweep", "swept", "swept"],

            // Page 4
            ["burn", "burnt / burned", "burnt / burned"],
            ["dream", "dreamt / dreamed", "dreamt / dreamed"],
            ["lean", "leant / leaned", "leant / leaned"],
            ["leap", "leapt / leaped", "leapt / leaped"],
            ["learn", "learnt / learned", "learnt / learned"],
            ["mean", "meant", "meant"],
            ["build", "built", "built"],
            ["lend", "lent", "lent"],
            ["send", "sent", "sent"],
            ["spend", "spent", "spent"],
            ["spin", "spun", "spun"],
            ["come", "came", "come"],
            ["become", "became", "become"],
            ["run", "ran", "run"],
            ["bite", "bit", "bitten"],
            ["hide", "hid", "hidden"],
            ["drive", "drove", "driven"],
            ["fall", "fell", "fallen"],
            ["give", "gave", "given"],
            ["ride", "rode", "ridden"],
            ["rise", "rose", "risen"],
            ["shake", "shook", "shaken"],
            ["take", "took", "taken"],
            ["write", "wrote", "written"],
            ["begin", "began", "begun"],
            ["break", "broke", "broken"],
            ["choose", "chose", "chosen"],
            ["drink", "drank", "drunk"],
            ["forget", "forgot", "forgotten"],
            ["forgive", "forgave", "forgiven"],
            ["freeze", "froze", "frozen"],

            // Page 5
            ["ring", "rang", "rung"],
            ["shrink", "shrank", "shrunk"],
            ["sing", "sang", "sung"],
            ["sink", "sank", "sunk"],
            ["speak", "spoke", "spoken"],
            ["steal", "stole", "stolen"],
            ["swim", "swam", "swum"],
            ["wake", "woke / waked", "woken / waked"],
            ["blow", "blew", "blown"],
            ["draw", "drew", "drawn"],
            ["fly", "flew", "flown"],
            ["grow", "grew", "grown"],
            ["know", "knew", "known"],
            ["throw", "threw", "thrown"],
            ["bear", "bore", "borne"],
            ["tear", "tore", "torn"],
            ["wear", "wore", "worn"],
            ["beat", "beat", "beaten"],
            ["eat", "ate", "eaten"],
            ["go", "went", "gone"],
            ["lay (to put or to place)", "laid", "laid"],
            ["lie (to lie down)", "lay", "lain"],
            ["lie (to speak falsely)", "lied", "lied"],
            ["see", "saw", "seen"],
            ["burst", "burst", "burst"],
            ["cost", "cost", "cost"],
            ["cut", "cut", "cut"],
            ["hit", "hit", "hit"],
            ["hurt", "hurt", "hurt"],
            ["let", "let", "let"],

            // Page 6
            ["put", "put", "put"],
            ["quit", "quit/quitted", "quit/quitted"],
            ["read", "read", "read"],
            ["set", "set", "set"],
            ["shut", "shut", "shut"],
            ["spread", "spread", "spread"],
            ["be(am/is/are)", "was / were", "been"],
            ["do", "did", "done"],
            ["has/have", "had", "had"]
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isWaitingForNext = false;

        // Elements
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const questionCountEl = document.getElementById('question-count');
        const scoreTextEl = document.getElementById('score-text');
        const presentInput = document.getElementById('present-input');
        const pastInput = document.getElementById('past-input');
        const ppInput = document.getElementById('pp-input');
        const feedbackBox = document.getElementById('feedback-box');
        const submitBtn = document.getElementById('submit-btn');

        // Helper: Shuffle array
        function getRandomQuestions(list, count) {
            const shuffled = [...list].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // Initialize Game
        function initGame() {
            currentQuestions = getRandomQuestions(FULL_VERB_DATABASE, 20);
            currentIndex = 0;
            score = 0;
            isWaitingForNext = false;

            endScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showFinalScore();
                return;
            }

            isWaitingForNext = false;

            const q = currentQuestions[currentIndex];
            presentInput.value = q[0];
            pastInput.value = '';
            ppInput.value = '';

            pastInput.disabled = false;
            ppInput.disabled = false;
            submitBtn.disabled = false;

            feedbackBox.className = "min-h-[48px] flex items-center justify-center text-center p-2 rounded-xl text-base font-bold transition-all";
            feedbackBox.textContent = '';

            questionCountEl.textContent = `Question ${currentIndex + 1} / 20`;
            scoreTextEl.textContent = `Score: ${score} / 20`;

            // Auto-focus on Past input box
            setTimeout(() => pastInput.focus(), 50);
        }

        // Normalize text for flexible checking
        function normalize(str) {
            return str.toLowerCase().trim().replace(/\s+/g, ' ');
        }

        // Check if answer matches (handles alternatives split by '/')
        function checkSingleAnswer(userInput, correctAnswer) {
            const normUser = normalize(userInput);
            const normCorrect = normalize(correctAnswer);

            if (normUser === normCorrect) return true;

            // Handle optional slash variations like "burnt / burned" or "was / were"
            if (normCorrect.includes('/')) {
                const parts = normCorrect.split('/').map(p => normalize(p));
                return parts.includes(normUser);
            }
            return false;
        }

        // Check Answer
        function checkAnswer() {
            if (isWaitingForNext) return;

            const userPast = pastInput.value.trim();
            const userPP = ppInput.value.trim();

            if (!userPast || !userPP) {
                feedbackBox.className = "min-h-[48px] flex items-center justify-center text-center p-2 rounded-xl text-sm font-bold bg-amber-100 text-amber-700 border border-amber-200";
                feedbackBox.textContent = "⚠️ Please fill in both boxes before submitting!";
                return;
            }

            const current = currentQuestions[currentIndex];
            const isPastCorrect = checkSingleAnswer(userPast, current[1]);
            const isPPCorrect = checkSingleAnswer(userPP, current[2]);

            isWaitingForNext = true;
            pastInput.disabled = true;
            ppInput.disabled = true;
            submitBtn.disabled = true;

            if (isPastCorrect && isPPCorrect) {
                score++;
                scoreTextEl.textContent = `Score: ${score} / 20`;
                feedbackBox.className = "min-h-[48px] flex items-center justify-center text-center p-2 rounded-xl text-base font-bold bg-emerald-100 text-emerald-700 border border-emerald-200";
                feedbackBox.textContent = "🎉 Correct! Great job!";
                
                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 1200);
            } else {
                feedbackBox.className = "min-h-[48px] flex items-center justify-center text-center p-2 rounded-xl text-sm font-bold bg-rose-100 text-rose-700 border border-rose-200";
                feedbackBox.textContent = `❌ Not quite! Correct: Past → "${current[1]}", PP → "${current[2]}"`;
                
                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 2800);
            }
        }

        // Keyboard Navigation (Enter key handling)
        pastInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (pastInput.value.trim()) {
                    ppInput.focus();
                } else {
                    checkAnswer();
                }
            }
        });

        ppInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        // Show Final Score Screen
        function showFinalScore() {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');

            const finalScoreEl = document.getElementById('final-score');
            const finalPraiseEl = document.getElementById('final-praise');

            finalScoreEl.textContent = `${score} / 20`;

            if (score === 20) {
                finalPraiseEl.textContent = "🌟 Perfect Score! You are a master of verb forms!";
            } else if (score >= 15) {
                finalPraiseEl.textContent = "👏 Great job! Almost perfect, keep it up!";
            } else if (score >= 10) {
                finalPraiseEl.textContent = "👍 Good effort! Practice makes perfect!";
            } else {
                finalPraiseEl.textContent = "💪 Don't give up! Play again to improve your score!";
            }
        }

        // Start game on page load
        window.onload = initGame;
    </script>
</body>
</html>
