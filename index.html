<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Verb Table Game!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 550px;
            text-align: center;
            border: 4px solid #4682b4;
            box-sizing: border-box;
            margin: 20px;
        }
        h1 {
            color: #2e8b57;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .score-board {
            font-size: 18px;
            color: #ff4500;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4682b4;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #2e8b57;
        }
        input:disabled {
            background-color: #e9ecef;
            color: #495057;
        }
        button {
            background-color: #4682b4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(70, 130, 180, 0.3);
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #365f8c;
        }
        #feedback {
            margin-top: 15px;
            font-size: 16px;
            font-style: italic;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1 id="gameTitle">✏️ Fill in the Verb Table! ✏️</h1>
    <div class="score-board" id="scoreBoard">Score: 0 / 20</div>

    <div class="form-group">
        <label>Present (原形):</label>
        <input type="text" id="presentInput" disabled>
    </div>

    <div class="form-group">
        <label>Past (过去式):</label>
        <input type="text" id="pastInput" placeholder="Type past tense & press Enter..." autocomplete="off">
    </div>

    <div class="form-group">
        <label>Past Participle (过去分词):</label>
        <input type="text" id="ppInput" placeholder="Type past participle & press Enter..." autocomplete="off">
    </div>

    <div id="feedback"></div>

    <button id="submitBtn" onclick="checkAnswer()">Check Answer 🚀</button>
</div>

<script>
    const FULL_VERB_DATABASE = [
        ["answer", "answered", "answered"], ["ask", "asked", "asked"], ["call", "called", "called"],
        ["climb", "climbed", "climbed"], ["enjoy", "enjoyed", "enjoyed"], ["help", "helped", "helped"],
        ["jump", "jumped", "jumped"], ["knock", "knocked", "knocked"], ["laugh", "laughed", "laughed"],
        ["listen", "listened", "listened"], ["look", "looked", "looked"], ["open", "opened", "opened"],
        ["pass", "passed", "passed"], ["pick", "picked", "picked"], ["play", "played", "played"],
        ["rain", "rained", "rained"], ["rest", "rested", "rested"], ["shout", "shouted", "shouted"],
        ["show", "showed", "showed / shown"], ["start", "started", "started"], ["stay", "stayed", "stayed"],
        ["talk", "talked", "talked"], ["turn", "turned", "turned"], ["wait", "waited", "waited"],
        ["wash", "washed", "washed"], ["watch", "watched", "watched"], ["work", "worked", "worked"],
        ["agree", "agreed", "agreed"], ["believe", "believed", "believed"], ["change", "changed", "changed"],
        ["close", "closed", "closed"], ["dance", "danced", "danced"], ["die", "died", "died"],
        ["live", "lived", "lived"], ["move", "moved", "moved"], ["promise", "promised", "promised"],
        ["smile", "smiled", "smiled"], ["use", "used", "used"], ["beg", "begged", "begged"],
        ["clap", "clapped", "clapped"], ["drop", "dropped", "dropped"], ["kidnap", "kidnapped", "kidnapped"],
        ["plan", "planned", "planned"], ["rob", "robbed", "robbed"], ["rub", "rubbed", "rubbed"],
        ["quarrel", "quarrelled", "quarrelled"], ["stir", "stirred", "stirred"], ["stop", "stopped", "stopped"],
        ["trap", "trapped", "trapped"], ["travel", "travelled", "travelled"], ["carry", "carried", "carried"],
        ["copy", "copied", "copied"], ["cry", "cried", "cried"], ["hurry", "hurried", "hurried"],
        ["pay", "paid", "paid"], ["reply", "replied", "replied"], ["say", "said", "said"],
        ["study", "studied", "studied"], ["tidy", "tidied", "tidied"], ["try", "tried", "tried"],
        ["dig", "dug", "dug"], ["find", "found", "found"], ["get", "got", "got"],
        ["hang", "hung", "hung"], ["hang (put to death)", "hanged, hung", "hanged, hung"], ["hear", "heard", "heard"],
        ["hold", "held", "held"], ["light", "lit", "lit"], ["lose", "lost", "lost"],
        ["make", "made", "made"], ["sell", "sold", "sold"], ["shine", "shone", "shone"],
        ["shoot", "shot", "shot"], ["sit", "sat", "sat"], ["stand", "stood", "stood"],
        ["stick", "stuck", "stuck"], ["strike", "struck", "struck"], ["swing", "swung", "swung"],
        ["tell", "told", "told"], ["understand", "understood", "understood"], ["win", "won", "won"],
        ["bring", "brought", "brought"], ["buy", "bought", "bought"], ["fight", "fought", "fought"],
        ["think", "thought", "thought"], ["creep", "crept", "crept"], ["catch", "caught", "caught"],
        ["teach", "taught", "taught"], ["feed", "fed", "fed"], ["feel", "felt", "felt"],
        ["keep", "kept", "kept"], ["kneel", "knelt", "knelt"], ["lead", "led", "led"],
        ["leave", "left", "left"], ["meet", "met", "met"], ["sleep", "slept", "slept"],
        ["smell", "smelt", "smelt"], ["spell", "spelt", "spelt"], ["sweep", "swept", "swept"],
        ["burn", "burnt / burned", "burnt / burned"], ["dream", "dreamt / dreamed", "dreamt / dreamed"],
        ["lean", "leant / leaned", "leant / leaned"], ["leap", "leapt / leaped", "leapt / leaped"],
        ["learn", "learnt / learned", "learnt / learned"], ["mean", "meant", "meant"],
        ["build", "built", "built"], ["lend", "lent", "lent"], ["send", "sent", "sent"],
        ["spend", "spent", "spent"], ["spin", "spun", "spun"], ["come", "came", "come"],
        ["become", "became", "become"], ["run", "ran", "run"], ["bite", "bit", "bitten"],
        ["hide", "hid", "hidden"], ["drive", "drove", "driven"], ["fall", "fell", "fallen"],
        ["give", "gave", "given"], ["ride", "rode", "ridden"], ["rise", "rose", "risen"],
        ["shake", "shook", "shaken"], ["take", "took", "taken"], ["write", "wrote", "written"],
        ["begin", "began", "begun"], ["break", "broke", "broken"], ["choose", "chose", "chosen"],
        ["drink", "drank", "drunk"], ["forget", "forgot", "forgotten"], ["forgive", "forgave", "forgiven"],
        ["freeze", "froze", "frozen"], ["ring", "rang", "rung"], ["shrink", "shrank", "shrunk"],
        ["sing", "sang", "sung"], ["sink", "sank", "sunk"], ["speak", "spoke", "spoken"],
        ["steal", "stole", "stolen"], ["swim", "swam", "swum"], ["wake", "woke / waked", "woken / waked"],
        ["blow", "blew", "blown"], ["draw", "drew", "drawn"], ["fly", "flew", "flown"],
        ["grow", "grew", "grown"], ["know", "knew", "known"], ["throw", "threw", "thrown"],
        ["bear", "bore", "borne"], ["tear", "tore", "torn"], ["wear", "wore", "worn"],
        ["beat", "beat", "beaten"], ["eat", "ate", "eaten"], ["go", "went", "gone"],
        ["lay", "laid", "laid"], ["lie (to lie down)", "lay", "lain"], ["lie (to speak falsely)", "lied", "lied"],
        ["see", "saw", "seen"], ["burst", "burst", "burst"], ["cost", "cost", "cost"],
        ["cut", "cut", "cut"], ["hit", "hit", "hit"], ["hurt", "hurt", "hurt"],
        ["let", "let", "let"], ["put", "put", "put"], ["quit", "quit/quitted", "quit/quitted"],
        ["read", "read", "read"], ["set", "set", "set"], ["shut", "shut", "shut"],
        ["spread", "spread", "spread"], ["be (am/is/are)", "was / were", "been"],
        ["do", "did", "done"], ["has/have", "had", "had"]
    ];

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let wrongAnswers = [];
    let isReviewMode = false;

    function initGame() {
        let shuffled = [...FULL_VERB_DATABASE].sort(() => 0.5 - Math.random());
        questions = shuffled.slice(0, 20);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        isReviewMode = false;
        document.getElementById("gameTitle").textContent = "✏️ Fill in the Verb Table! ✏️";
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex < questions.length) {
            document.getElementById("presentInput").value = questions[currentIndex][0];
            document.getElementById("pastInput").value = "";
            document.getElementById("ppInput").value = "";
            document.getElementById("feedback").textContent = "";
            
            if (!isReviewMode) {
                document.getElementById("scoreBoard").textContent = `Score: ${score} / 20`;
            } else {
                document.getElementById("scoreBoard").textContent = `🔄 Redo Mistakes (${currentIndex + 1} / ${questions.length})`;
            }
            document.getElementById("pastInput").focus();
        } else {
            if (!isReviewMode && wrongAnswers.length > 0) {
                isReviewMode = true;
                questions = [...wrongAnswers];
                currentIndex = 0;
                document.getElementById("gameTitle").textContent = "🔄 Time to Fix Your Mistakes! 🔄";
                alert(`You made ${questions.length} mistake(s). Let's practice them again right now!`);
                loadQuestion();
            } else {
                showFinalScore();
            }
        }
    }

    function checkAnswer() {
        let userPast = document.getElementById("pastInput").value.trim().toLowerCase();
        let userPP = document.getElementById("ppInput").value.trim().toLowerCase();

        if (!userPast || !userPP) {
            alert("Please fill in both boxes!");
            return;
        }

        let currentVerb = questions[currentIndex];
        let correctPast = currentVerb[1].toLowerCase().trim();
        let correctPP = currentVerb[2].toLowerCase().trim();
        let feedback = document.getElementById("feedback");

        if (userPast === correctPast && userPP === correctPP) {
            if (!isReviewMode) score++;
            feedback.style.color = "green";
            feedback.textContent = "🎉 Correct! Great job!";
            setTimeout(nextQuestion, 1200);
        } else {
            if (!isReviewMode) {
                let exists = wrongAnswers.some(item => item[0] === currentVerb[0]);
                if (!exists) {
                    wrongAnswers.push(currentVerb);
                }
            }
            feedback.style.color = "red";
            feedback.textContent = `❌ Correct was -> Past: ${correctPast}, PP: ${correctPP}`;
            setTimeout(nextQuestion, 2500);
        }
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function showFinalScore() {
        let container = document.querySelector(".game-container");
        container.innerHTML = `
            <h1>🏆 Quiz Completed! 🏆</h1>
            <div style="font-size: 20px; color: #2e8b57; margin: 15px 0; font-weight: bold;">Your Final Score: ${score} / 20</div>
            <p style="font-size: 16px; color: #555; margin: 15px 0;">${score === 20 ? "Amazing work! Zero mistakes! ⭐" : "Great job completing your mistake review round! 👍"}</p>
            <button onclick="initGame()">Play Again (New Verbs!) 🔄</button>
        `;
    }

    document.getElementById("pastInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            document.getElementById("ppInput").focus();
        }
    });

    document.getElementById("ppInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            checkAnswer();
        }
    });

    initGame();
</script>

</body>
</html>
